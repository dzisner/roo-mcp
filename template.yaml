AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Roo MCP HTTP endpoint (mcp.roo.bz) — Lambda + HTTP API

Parameters:
  DomainName:
    Type: String
    Default: mcp.roo.bz
    Description: Custom domain served by this API.
  CertificateArn:
    Type: String
    Description: ARN of an ACM certificate for DomainName, in the SAME region as this stack.
  JweKey:
    Type: String
    NoEcho: true
    Description: >
      Base64 of 32 random bytes used to encrypt OAuth tokens.
      Generate with: openssl rand -base64 32. Supplied by GitHub Actions from a secret.
  JweKeyPrevious:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Optional. Previous value of JweKey during a rotation. Decrypt accepts tokens
      minted under either key; mint uses JweKey only. Leave empty when not rotating.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 29      # API Gateway HTTP API hard-caps at 30s; stay just under.
    Architectures: [arm64]
    LoggingConfig:
      LogFormat: JSON

Resources:
  RooMcpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref CertificateArn
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
      DisableExecuteApiEndpoint: false   # keep the *.execute-api.* URL for pre-DNS testing

  # OAuth grants + rate-limit counters. One single-table-design table, partitioned
  # by a prefixed `pk` (code#..., refresh#..., family#..., rl#...). TTL on the
  # `ttl` attribute reclaims expired rows automatically, so the table never grows
  # beyond active-session size regardless of traffic.
  #
  # PAY_PER_REQUEST is the right default: traffic is bursty (every OAuth flow
  # writes exactly one code item and one refresh item per rotation), and
  # provisioning capacity for the 99th percentile wastes money while still
  # throttling during spikes.
  RooMcpGrantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false   # Items are ephemeral (TTL <= 90 days); a snapshot would be stale and PII.
      SSESpecification:
        SSEEnabled: true                    # AWS-managed KMS; the items contain OAuth artifacts, not plaintext keys, but defense in depth.

  RooMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda.handler
      Description: Thin MCP wrapper + OAuth 2.1 shim. Grants state lives in RooMcpGrantsTable.
      Environment:
        Variables:
          ROO_MCP_JWE_KEY: !Ref JweKey
          ROO_MCP_JWE_KEY_PREVIOUS: !Ref JweKeyPrevious
          ROO_MCP_ISSUER: !Sub 'https://${DomainName}'
          ROO_MCP_GRANTS_TABLE: !Ref RooMcpGrantsTable
      Policies:
        # Minimum needed by src/oauth/grants.ts: PutItem (conditional + unconditional),
        # GetItem (family revoke check), UpdateItem (rate-limit counter). No Delete,
        # no Scan, no Query — DDB TTL handles cleanup.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RooMcpGrantsTable.Arn
      Events:
        Default:
          Type: HttpApi
          Properties:
            ApiId: !Ref RooMcpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: node22
        Format: esm
        Minify: false
        Sourcemap: true
        EntryPoints:
          - src/http/lambda.ts
        OutExtension:
          - .js=.mjs

Outputs:
  CustomDomain:
    Description: Hit this once DNS is in place.
    Value: !Sub 'https://${DomainName}/mcp'
  DefaultApiEndpoint:
    Description: Use this for pre-DNS smoke tests. Append /mcp.
    Value: !Sub 'https://${RooMcpApi}.execute-api.${AWS::Region}.amazonaws.com'
  RegionalDomainTarget:
    Description: Create a DNS CNAME at mcp.roo.bz pointing to this value.
    Value: !GetAtt RooMcpApi.DomainName.RegionalDomainName
  HostedZoneIdForAlias:
    Description: If using Route 53 ALIAS instead of CNAME, use this hosted zone.
    Value: !GetAtt RooMcpApi.DomainName.RegionalHostedZoneId
  GrantsTableName:
    Description: DynamoDB table holding OAuth grant state and rate-limit counters.
    Value: !Ref RooMcpGrantsTable
